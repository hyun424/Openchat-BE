substitutions:
  _REGION: asia-northeast1
  _SERVICE: openchat-be-dev
  _REPOSITORY: openchat-dev
  _CLOUDSQL_INSTANCE: spatia-platform-kdh:asia-northeast1:openchat-dev-mysql
  _VPC_CONNECTOR: openchat-dev-conn
  _REDIS_HOST: 10.188.119.131
  _CORS_ORIGINS: https://openchat-dev.spatia.site,http://localhost:3000

steps:
  - id: test
    name: gradle:8-jdk17
    entrypoint: ./gradlew
    args: ["test", "--no-daemon"]
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$BUILD_ID
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:latest
      - .
  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$BUILD_ID
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --port=8080
      - --memory=1Gi
      - --cpu=1
      - --min-instances=0
      - --max-instances=5
      - --add-cloudsql-instances=${_CLOUDSQL_INSTANCE}
      - --vpc-connector=${_VPC_CONNECTOR}
      - --vpc-egress=private-ranges-only
      - --set-env-vars=^@^SPRING_PROFILES_ACTIVE=dev@APP_ROLE=combined@APP_KAFKA_ENABLED=false@CORS_ORIGINS=${_CORS_ORIGINS}@CORS_ALLOWED_ORIGINS=${_CORS_ORIGINS}@SPRING_DATASOURCE_URL=jdbc:mysql://google/openchat_dev?cloudSqlInstance=${_CLOUDSQL_INSTANCE}&socketFactory=com.google.cloud.sql.mysql.SocketFactory&useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true@SPRING_DATASOURCE_USERNAME=openchat@REDIS_HOST=${_REDIS_HOST}@SPRING_DATA_REDIS_HOST=${_REDIS_HOST}@REDIS_PORT=6379@SPRING_DATA_REDIS_PORT=6379@SPRING_JPA_HIBERNATE_DDL_AUTO=update@SPRING_JPA_SHOW_SQL=false@SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE=5@SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE=0@COOKIE_SECURE=true@GOOGLE_CLIENT_ID=@GOOGLE_CLIENT_SECRET=@ROOM_SUMMARY_WORKER_ENABLED=false@ROOM_SUMMARY_SUMMARIZER_MODE=mock
      - --set-secrets=SPRING_DATASOURCE_PASSWORD=openchat-dev-db-password:latest,JWT_SECRET=openchat-dev-jwt-secret:latest

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$BUILD_ID
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:latest
